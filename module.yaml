    NyxSUSFS; it does not need SuSFS.
description: README.md
license: AGPL-3.0-only
homepage: https://github.com/poqdavid/nyxprops
support: https://github.com/poqdavid/nyxprops/issues
tags: [props, resetprop, root-hiding, webui]
metamodule: false

authors:
    - name: poqdavid
      url: https://github.com/poqdavid

compatibility:
    architectures: [arm64-v8a, armeabi-v7a, x86_64, x86]

release:
    assetPattern: 'nyxprops-*.zip'
